<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Demo</title>
    <style>
        /* Import a modern font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Home Page Container */
        #home-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #home-container.hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-20px);
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 2.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Modern Premium Button */
        .start-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 18px 48px;
            font-size: 1.15rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: all 0.6s ease;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(140, 82, 255, 0.15), 0 0 40px rgba(140, 82, 255, 0.1) inset;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Loading Screen Container */
        #loading-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 20;
        }

        #loading-container.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Exact Video Configuration */
        #loading-video {
            width: 400px; /* Adjust size as needed */
            height: 400px;
            object-fit: cover;
            /* Screen blend mode drops the black background of the video for a seamless look */
            mix-blend-mode: screen; 
            border-radius: 50%; /* Optional: softens edges if video is square */
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 300;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Home Page -->
    <div id="home-container">
        <h1>Discover Next</h1>
        <button class="start-btn" id="start-btn">Initiate Sequence</button>
    </div>

    <!-- Loading Overlay using cbotloading.mp4 -->
    <div id="loading-container">
        <!-- We use the exact cbotloading.mp4 video file as the illustration -->
        <video id="loading-video" muted loop playsinline>
            <source src="cbotloading.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="loading-text">Authenticating</div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const homeContainer = document.getElementById('home-container');
        const loadingContainer = document.getElementById('loading-container');
        const loadingVideo = document.getElementById('loading-video');

        startBtn.addEventListener('click', () => {
            // 1. Hide home content with animation
            homeContainer.classList.add('hidden');
            
            // 2. Short delay before showing loading screen for smooth transition
            setTimeout(() => {
                loadingContainer.classList.add('active');
                // Play the exact illustration video
                loadingVideo.play();
            }, 300);
            
            // Optional: To demonstrate it going back after some time (e.g. after a fetch request)
            /*
            setTimeout(() => {
                loadingContainer.classList.remove('active');
                homeContainer.classList.remove('hidden');
                loadingVideo.pause();
                loadingVideo.currentTime = 0;
            }, 6000);
            */
        });
    </script>
</body>
</html>
